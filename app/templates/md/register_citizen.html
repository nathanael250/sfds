{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Register New Citizen</h3>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('md.register_citizen') }}">
                        <div class="mb-3">
                            <label for="name" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="national_id" class="form-label">National ID</label>
                            <input type="text" class="form-control" id="national_id" name="national_id" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="upi_number" class="form-label">UPI Number</label>
                            <input type="text" class="form-control" id="upi_number" name="upi_number" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="phone_number" class="form-label">Phone Number</label>
                            <input type="text" class="form-control" id="phone_number" name="phone_number" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="plot_size" class="form-label">Plot Size (acres)</label>
                            <input type="number" step="0.01" class="form-control" id="plot_size" name="plot_size" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="allowed_seeds" class="form-label">Allowed Seeds (kg)</label>
                            <input type="number" step="0.01" class="form-control" id="allowed_seeds" name="allowed_seeds" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="allowed_fertilizer" class="form-label">Allowed Fertilizer (kg)</label>
                            <input type="number" step="0.01" class="form-control" id="allowed_fertilizer" name="allowed_fertilizer" required>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Register Citizen</button>
                            <a href="{{ url_for('md.view_citizens') }}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
