{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-6">
        <h1 class="text-2xl font-bold mb-6">Upload Logo</h1>
        
        <form method="POST" enctype="multipart/form-data">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="logo">
                    Select Logo
                </label>
                <input type="file" name="logo" id="logo" accept=".png,.jpg,.jpeg" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500">
                <p class="text-gray-500 text-xs mt-1">Allowed formats: PNG, JPG, JPEG</p>
            </div>
            
            {% if current_user.logo_path %}
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">
                    Current Logo
                </label>
                <img src="{{ url_for('static', filename=current_user.logo_path) }}" alt="Current Logo" class="max-w-xs">
            </div>
            {% endif %}
            
            <div class="flex items-center justify-between">
                <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
                    Upload Logo
                </button>
                <a href="{{ url_for('agrodealer.dashboard') }}" class="text-gray-600 hover:text-gray-800">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
