{% extends "base.html" %}

{% block title %}Register Citizen{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-lg shadow-md p-6">
        <h2 class="text-xl font-semibold text-gray-800 mb-6">Register New Citizen</h2>
        
        <form method="POST" class="space-y-6">
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700">Citizen Name</label>
                <input type="text" id="name" name="name" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" placeholder="Enter name" required>
            </div>

            <div>
                <label for="national_id" class="block text-sm font-medium text-gray-700">National ID</label>
                <input type="text" id="national_id" name="national_id" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" placeholder="Enter National ID" required>
            </div>

            <div>
                <label for="upi" class="block text-sm font-medium text-gray-700">UPI Number</label>
                <input type="text" id="upi" name="upi" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" placeholder="Enter UPI Number" required>
            </div>

            <div>
                <label for="phone" class="block text-sm font-medium text-gray-700">Phone Number</label>
                <input type="tel" id="phone" name="phone" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" placeholder="Enter phone number" required>
            </div>

            <div>
                <label for="plot_size" class="block text-sm font-medium text-gray-700">Plot Size (m²)</label>
                <input type="number" id="plot_size" name="plot_size" step="0.01" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" placeholder="Enter plot size" required>
            </div>

            <div>
                <label for="allowed_seeds" class="block text-sm font-medium text-gray-700">Allowed Seeds</label>
                <input type="text" id="allowed_seeds" name="allowed_seeds" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" placeholder="Enter allowed seeds amount" required>
            </div>

            <div>
                <label for="allowed_fertilizer" class="block text-sm font-medium text-gray-700">Allowed Fertilizer</label>
                <input type="text" id="allowed_fertilizer" name="allowed_fertilizer" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" placeholder="Enter allowed fertilizer amount" required>
            </div>

            <div class="flex justify-end">
                <button type="submit" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                    Add Citizen
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
